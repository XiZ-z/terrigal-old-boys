<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Player — Terrigal Old Boys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Terrigal Old Boys">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123C3E">
<script src="data.js"></script>
<style>
  .pcard{background:var(--white); border:1px solid var(--paper-line); border-radius:var(--radius); overflow:hidden; max-width:520px; margin:0 auto 18px;}
  .pcard-head{background:var(--court); color:var(--white); padding:18px 20px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .pcard-name{font-family:'Bebas Neue'; font-size:40px; line-height:1; letter-spacing:0.02em;}
  .pcard-team{font-size:13px; color:#E4DDCB; margin-top:4px;}
  .pcard-team a{color:inherit;}
  .pcard-pill{background:var(--ball); color:var(--court-dark); font-weight:700; font-size:12px; padding:5px 11px; border-radius:999px; white-space:nowrap;}
  .pcard-body{padding:18px 20px 6px;}
  .tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px;}
  .tile{border:1px solid var(--paper-line); border-radius:12px; padding:12px 14px; background:var(--paper);}
  .tile .big{font-family:'Bebas Neue'; font-size:30px; color:var(--court); line-height:1;}
  .tile .big small{font-family:'IBM Plex Sans'; font-size:13px; color:var(--ink-soft); font-weight:500; margin-left:4px;}
  .tile .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:5px; letter-spacing:0.02em;}
  .pcard h4{font-family:'Bebas Neue'; font-size:19px; letter-spacing:0.03em; color:var(--court); margin:0 0 8px;}
  .strip{display:grid; grid-template-columns:repeat(14,1fr); gap:3px; margin-bottom:4px;}
  .sq{aspect-ratio:1; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--court-dark); background:var(--paper); border:1px dashed var(--paper-line);}
  .sq.w{background:var(--ball); border:0;} .sq.d{background:#E9E3C8; border:0;} .sq.l{background:#F0C8B4; border:0;}
  .sq.sub{background:var(--white); border:2px solid var(--court-mid);}
  .sq.future{background:transparent; border:1px solid var(--paper-line); opacity:.55;}
  .sqlab{display:grid; grid-template-columns:repeat(14,1fr); gap:3px; font-size:8.5px; color:var(--ink-soft); text-align:center; margin-bottom:6px;}
  .legend{font-size:11.5px; color:var(--ink-soft); margin-bottom:18px; line-height:1.5;}
  .recent{list-style:none; margin:0 0 18px; padding:0;}
  .recent li{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:7px 0; border-bottom:1px solid var(--paper-line);}
  .recent li:last-child{border-bottom:0;}
  .res{font-weight:700; color:var(--court); white-space:nowrap;}
  .pcard-foot{font-size:11.5px; color:var(--ink-soft); padding:0 20px 16px; line-height:1.5;}
  .back-link{display:inline-block; margin:0 0 14px; font-size:13.5px; font-weight:600; color:var(--court);}
  .pcard-wrap{max-width:520px; margin:0 auto;}
</style>
</head>
<body data-page="teams">

<div id="nav-placeholder"></div>

<main>
  <div class="pcard-wrap"><a class="back-link" href="teams.html">&larr; Teams</a></div>
  <div id="player-root"></div>
</main>

<div id="footer-placeholder"></div>

<script>
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
  const fmt = v => (Math.round(v * 2) / 2).toString();

  // Every weekly match a team plays, in round order, with the key shared by
  // RESULTS and LINEUPS and which side (0 = A, 1 = B) the team is on.
  function teamMatches(team){
    const out = [];
    ALL_ROUNDS.forEach((pairs, i) => {
      const slot = pairs.findIndex(p => p.includes(team));
      if(slot < 0) return;
      const round = i + 1;
      const side = pairs[slot][0] === team ? 0 : 1;
      const opp = pairs[slot][side === 0 ? 1 : 0];
      const key = `${round}-${slot}`;
      out.push({ round, key, side, opp, result: RESULTS[key] || null, lineup: LINEUPS[key] || null });
    });
    return out;
  }

  // Team result for that night from the team's side (sets won v conceded).
  function outcome(m){
    if(!m.result) return null;
    const mine = m.side === 0 ? m.result.setsA : m.result.setsB;
    const theirs = m.side === 0 ? m.result.setsB : m.result.setsA;
    return { mine, theirs, res: mine > theirs ? 'w' : (mine < theirs ? 'l' : 'd') };
  }
  const RES_WORD = { w: 'Team won', d: 'Drew', l: 'Team lost' };

  function strip(cells){
    return `<div class="strip">${cells.join('')}</div>
      <div class="sqlab">${Array.from({ length: ALL_ROUNDS.length }, (_, i) => `<span>${i + 1}</span>`).join('')}</div>`;
  }

  function renderRoster(team, name){
    const matches = teamMatches(team);
    const played = matches.filter(m => m.result);
    const mine = played.filter(m => m.lineup && m.lineup[m.side].includes(name));
    const rec = { w: 0, d: 0, l: 0 };
    mine.forEach(m => { rec[outcome(m).res]++; });

    // Nights this player took the court for a different team.
    const tag = `${name}@${team}`;
    const subbed = [];
    Object.keys(LINEUPS).forEach(k => {
      const [r, s] = k.split('-').map(Number);
      const pair = ALL_ROUNDS[r - 1][s];
      LINEUPS[k].forEach((names, side) => { if(names.includes(tag)) subbed.push({ round: r, team: pair[side] }); });
    });
    subbed.sort((a, b) => a.round - b.round);

    const cells = matches.map(m => {
      const sub = subbed.find(x => x.round === m.round);
      if(!m.result) return `<div class="sq future" title="Round ${m.round}: not played yet"></div>`;
      if(m.lineup && m.lineup[m.side].includes(name)){
        const o = outcome(m);
        return `<div class="sq ${o.res}" title="Round ${m.round}: played, ${RES_WORD[o.res].toLowerCase()} ${fmt(o.mine)}–${fmt(o.theirs)}">${o.res.toUpperCase()}</div>`;
      }
      if(sub) return `<div class="sq sub" title="Round ${m.round}: played for Team ${sub.team}">S</div>`;
      return `<div class="sq" title="Round ${m.round}: not in the lineup">–</div>`;
    });

    const last = mine.slice(-3).reverse().map(m => {
      const o = outcome(m);
      return `<li><span>Round ${m.round} &middot; v Team ${m.opp}</span><span class="res">${fmt(o.mine)}–${fmt(o.theirs)} &middot; ${RES_WORD[o.res]}</span></li>`;
    }).join('');

    const captain = TEAMS[team].find(p => p.name === name && p.captain);
    return `
      <div class="pcard">
        <div class="pcard-head">
          <div>
            <div class="pcard-name">${esc(name)}</div>
            <div class="pcard-team"><a href="fixtures.html?team=${team}">Team ${team}</a>${captain ? ' &middot; Captain' : ''} &middot; Season 2 2026</div>
          </div>
          ${mine.length ? `<div class="pcard-pill">${rec.w}&ndash;${rec.d}&ndash;${rec.l} when playing</div>` : ''}
        </div>
        <div class="pcard-body">
          <div class="tiles">
            <div class="tile"><div class="big">${mine.length}<small>of ${played.length}</small></div><div class="lbl">Rounds played for the team</div></div>
            <div class="tile"><div class="big">${subbed.length}</div><div class="lbl">Times filled in for another team</div></div>
          </div>
          <h4>Season at a glance</h4>
          ${strip(cells)}
          <div class="legend">W / D / L = played, and how the team did that night. S = filled in for another team. A dash = not in the lineup (rotation, away or sub).</div>
          ${last ? `<h4>Last three nights</h4><ul class="recent">${last}</ul>` : '<p class="empty-note">No appearances for the team yet.</p>'}
        </div>
        <div class="pcard-foot">Based on the names written on each weekly score sheet. Each player takes the court for 4 of the 6 sets on a night.</div>
      </div>`;
  }

  function renderReserve(name){
    const nights = [];
    Object.keys(LINEUPS).forEach(k => {
      const [r, s] = k.split('-').map(Number);
      const pair = ALL_ROUNDS[r - 1][s];
      LINEUPS[k].forEach((names, side) => {
        if(!names.includes(name)) return;
        const m = { round: r, key: k, side, opp: pair[side === 0 ? 1 : 0], result: RESULTS[k] || null };
        nights.push({ team: pair[side], m });
      });
    });
    nights.sort((a, b) => a.m.round - b.m.round);
    const grade = Object.keys(RESERVES).find(g => RESERVES[g].includes(name));
    // Deliberately no win/loss for reserves: they're doing the club a favour
    // by filling in, and a public "team lost" record against a named sub isn't
    // a fair reflection of that.
    const rows = nights.map(n =>
      `<li><span>Round ${n.m.round} &middot; for Team ${n.team}</span><span class="res">v Team ${n.m.opp}</span></li>`).join('');
    return `
      <div class="pcard">
        <div class="pcard-head">
          <div>
            <div class="pcard-name">${esc(name)}</div>
            <div class="pcard-team">Reserve${grade ? ` &middot; Grade ${grade}` : ''} &middot; Season 2 2026</div>
          </div>
        </div>
        <div class="pcard-body">
          <div class="tiles">
            <div class="tile"><div class="big">${nights.length}</div><div class="lbl">Nights filled in</div></div>
            <div class="tile"><div class="big">${new Set(nights.map(n => n.team)).size}</div><div class="lbl">Teams helped</div></div>
          </div>
          ${rows ? `<h4>Nights filled in</h4><ul class="recent">${rows}</ul>` : '<p class="empty-note">Hasn\'t been needed yet this season.</p>'}
        </div>
        <div class="pcard-foot">Reserves fill in when a team is short. Thanks to everyone who has helped out.</div>
      </div>`;
  }

  (function(){
    const params = new URLSearchParams(location.search);
    const root = document.getElementById('player-root');
    const team = Number(params.get('team'));
    const name = params.get('name') || '';
    const reserve = params.get('reserve');
    if(reserve && Object.values(RESERVES).some(l => l.includes(reserve))){
      root.innerHTML = renderReserve(reserve);
      document.title = `${reserve} — Terrigal Old Boys`;
    } else if(TEAMS[team] && TEAMS[team].some(p => p.name === name)){
      root.innerHTML = renderRoster(team, name);
      document.title = `${name} (Team ${team}) — Terrigal Old Boys`;
    } else {
      root.innerHTML = '<p class="empty-note" style="text-align:center;">Player not found. Head back to the Teams page and tap a name.</p>';
    }
  })();
</script>
<script src="nav.js"></script>
</body>
</html>
