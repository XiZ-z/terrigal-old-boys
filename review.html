<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Review Submissions — Terrigal Old Boys</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Terrigal Old Boys">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123C3E">
</head>
<body data-page="review">

<div id="nav-placeholder"></div>

<main>
  <div class="section-title">Review Submissions</div>
  <p class="section-sub">Check each photo against the extracted numbers, correct anything wrong, then approve or reject.</p>

  <div id="auth-gate" class="auth-card">
    <div class="field-row">
      <label for="password">Review password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>
    <button class="btn btn-primary" id="unlock-btn">Unlock</button>
    <div id="auth-status" class="status-msg error"></div>
  </div>

  <div id="tabs-wrap" style="display:none;">
    <div class="mode-toggle">
      <button type="button" id="tab-pending" class="active">Pending Review</button>
      <button type="button" id="tab-archive">Archive</button>
    </div>
    <div id="review-list"></div>
    <div id="archive-wrap" style="display:none;">
      <div class="mode-toggle" style="margin-bottom:1rem;">
        <button type="button" id="archive-status-approved" class="active">Approved</button>
        <button type="button" id="archive-status-rejected">Rejected</button>
      </div>
      <div class="fixtures-filter">
        <label for="archive-round-filter">Round</label>
        <select id="archive-round-filter">
          <option value="">All rounds</option>
        </select>
        <label for="archive-court-filter">Court</label>
        <select id="archive-court-filter">
          <option value="">All courts</option>
          <option value="1">Court 1</option>
          <option value="2">Court 2</option>
          <option value="3">Court 3</option>
          <option value="4">Court 4</option>
        </select>
      </div>
      <div id="archive-list"></div>
    </div>
  </div>
</main>

<div id="photo-lightbox" class="photo-lightbox" onclick="this.classList.remove('show')">
  <img id="photo-lightbox-img" src="" alt="Score sheet photo, full size">
</div>

<div id="footer-placeholder"></div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script>
  const authGate = document.getElementById('auth-gate');
  const tabsWrap = document.getElementById('tabs-wrap');
  const reviewList = document.getElementById('review-list');
  const archiveWrap = document.getElementById('archive-wrap');
  const archiveList = document.getElementById('archive-list');
  const authStatus = document.getElementById('auth-status');
  const tabPendingBtn = document.getElementById('tab-pending');
  const tabArchiveBtn = document.getElementById('tab-archive');
  const archiveRoundFilter = document.getElementById('archive-round-filter');
  const archiveCourtFilter = document.getElementById('archive-court-filter');
  const archiveStatusApprovedBtn = document.getElementById('archive-status-approved');
  const archiveStatusRejectedBtn = document.getElementById('archive-status-rejected');
  let archiveStatus = 'approved';
  const FINALS_STAGE_LABELS = { elimination: 'Elimination', semis: 'Semi Finals', grandFinal: 'Grand Final' };
  const archiveCache = {
    approved: { loaded: false, items: [] },
    rejected: { loaded: false, items: [] },
  };

  for (let i = 1; i <= 14; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `Round ${i}`;
    archiveRoundFilter.appendChild(opt);
  }

  function authHeader() {
    return { 'authorization': `Bearer ${sessionStorage.getItem('reviewPassword') || ''}` };
  }

  function handleAuthFailure() {
    sessionStorage.removeItem('reviewPassword');
    authGate.style.display = '';
    tabsWrap.style.display = 'none';
    authStatus.textContent = 'Wrong password.';
  }

  // Reads a fetch response as text first, then tries to parse it as JSON --
  // shows the *raw* body on failure (which reveals the real error, e.g. a
  // Netlify platform crash shape or a non-JSON error page) rather than a
  // dead-end "unknown error" that hides whatever actually went wrong.
  async function parseOrRawText(res) {
    const text = await res.text();
    try { return { data: JSON.parse(text), raw: text }; }
    catch { return { data: null, raw: text }; }
  }

  async function loadPending() {
    const res = await fetch('/.netlify/functions/list-pending', { headers: authHeader() });
    if (res.status === 401) { handleAuthFailure(); return; }
    const { data, raw } = await parseOrRawText(res);
    authGate.style.display = 'none';
    tabsWrap.style.display = '';
    if (!res.ok) {
      const detail = (data && (data.error || data.errorMessage)) || raw;
      reviewList.innerHTML = `<p class="empty-note">Couldn't load pending submissions (HTTP ${res.status}): ${detail}</p>`;
      return;
    }
    renderList(data.items);
  }

  async function loadArchive() {
    archiveList.innerHTML = '<p class="empty-note">Loading…</p>';
    const res = await fetch(`/.netlify/functions/list-${archiveStatus}`, { headers: authHeader() });
    if (res.status === 401) { handleAuthFailure(); return; }
    const { data, raw } = await parseOrRawText(res);
    if (!res.ok) {
      const detail = (data && (data.error || data.errorMessage)) || raw;
      archiveList.innerHTML = `<p class="empty-note">Couldn't load ${archiveStatus} submissions (HTTP ${res.status}): ${detail}</p>`;
      return;
    }
    archiveCache[archiveStatus] = { loaded: true, items: data.items };
    applyArchiveFilters();
  }

  // Round is the primary filter (find that week's sheets across every
  // court at once); Court further narrows to one specific match. Finals
  // and wet-round entries have no court/round-robin-round of their own, so
  // they only show under "All rounds".
  function applyArchiveFilters() {
    const roundVal = archiveRoundFilter.value;
    const courtVal = archiveCourtFilter.value;
    let filtered = archiveCache[archiveStatus].items;
    if (roundVal) {
      filtered = filtered
        .filter(item => !item.wet && item.mode === 'weekly' && item.roundNum === Number(roundVal))
        .sort((a, b) => a.courtNum - b.courtNum); // Court 1 -> 4 in order, not by approval time
      if (courtVal) filtered = filtered.filter(item => item.courtNum === Number(courtVal));
    }
    renderArchiveList(filtered);
  }

  archiveRoundFilter.addEventListener('change', applyArchiveFilters);
  archiveCourtFilter.addEventListener('change', applyArchiveFilters);

  function switchArchiveStatus(status) {
    if (archiveStatus === status) return;
    archiveStatus = status;
    archiveStatusApprovedBtn.classList.toggle('active', status === 'approved');
    archiveStatusRejectedBtn.classList.toggle('active', status === 'rejected');
    if (archiveCache[status].loaded) applyArchiveFilters();
    else loadArchive();
  }
  archiveStatusApprovedBtn.addEventListener('click', () => switchArchiveStatus('approved'));
  archiveStatusRejectedBtn.addEventListener('click', () => switchArchiveStatus('rejected'));

  tabPendingBtn.addEventListener('click', () => {
    tabPendingBtn.classList.add('active');
    tabArchiveBtn.classList.remove('active');
    reviewList.style.display = '';
    archiveWrap.style.display = 'none';
  });
  tabArchiveBtn.addEventListener('click', () => {
    tabArchiveBtn.classList.add('active');
    tabPendingBtn.classList.remove('active');
    reviewList.style.display = 'none';
    archiveWrap.style.display = '';
    if (!archiveCache[archiveStatus].loaded) loadArchive();
  });

  function renderList(items) {
    authGate.style.display = 'none';
    reviewList.style.display = '';

    if (items.length === 0) {
      reviewList.innerHTML = '<p class="empty-note">Nothing pending review right now.</p>';
      return;
    }

    // Flags multiple pending submissions for the same round/court or finals
    // slot/stage -- doesn't block anything (a genuine double-upload of the
    // same match is harmless, and a wrong-court mistake needs a human to
    // sort out anyway), just makes duplicates obvious while reviewing.
    function dupeKeyFor(item) {
      if (item.wet && item.mode === 'finals') return `wet-finals-${item.finalsStage}`;
      if (item.wet) return `wet-weekly-${item.roundNum}`;
      if (item.mode === 'finals') return `score-finals-${item.finalsSlot}`;
      return `score-weekly-${item.key}`;
    }
    const dupeCounts = {};
    items.forEach(item => { const k = dupeKeyFor(item); dupeCounts[k] = (dupeCounts[k] || 0) + 1; });
    function duplicatePill(item) {
      const count = dupeCounts[dupeKeyFor(item)];
      return count > 1 ? `<span class="pill" style="background:var(--clay); color:var(--white); border-color:var(--clay);">Submitted ${count}&times;</span>` : '';
    }

    // Flags a submission where the uploader was warned the sets and/or
    // games totals didn't match the fixed invariant (6/48 weekly, 8/64
    // finals -- see submit-sheet.js) and chose Submit Anyway rather than
    // retaking the photo -- worth a closer look before approving, since it
    // means the read is known-suspect.
    function mismatchPill(item) {
      if (!item.mismatchAcknowledged) return '';
      const expectedSets = item.mode === 'finals' ? 8 : 6;
      const expectedGames = item.mode === 'finals' ? 64 : 48;
      const actualSets = item.extracted.setsA + item.extracted.setsB;
      const actualGames = item.extracted.gamesA + item.extracted.gamesB;
      const parts = [];
      if (actualGames !== expectedGames) parts.push(`games ${actualGames}≠${expectedGames}`);
      if (actualSets !== expectedSets) parts.push(`sets ${actualSets}≠${expectedSets}`);
      return `<span class="pill" style="background:var(--clay); color:var(--white); border-color:var(--clay);" title="Uploader was warned this didn't add up and submitted anyway">⚠ ${parts.join(', ')}</span>`;
    }

    reviewList.innerHTML = items.map(item => {
      if (item.wet && item.mode === 'finals') {
        const stageOptions = FINALS_STAGES_LIST.map(s =>
          `<option value="${s}" ${s === item.finalsStage ? 'selected' : ''}>${FINALS_STAGE_LABELS[s]}</option>`).join('');
        return `
          <div class="review-item" data-id="${item.id}" style="grid-template-columns:1fr;">
            <div>
              <div class="review-meta"><span class="pill wet">WET</span> ${duplicatePill(item)}&nbsp;
                <select id="stage-${item.id}" onchange="updateWetFinalsNote('${item.id}')">${stageOptions}</select>
                reported postponed &middot; submitted ${new Date(item.createdAt).toLocaleString()}</div>
              <p class="section-sub" id="wet-note-${item.id}" style="margin:8px 0;">${wetFinalsNoteText(item.finalsStage)}</p>
              <div class="review-actions">
                <button class="btn btn-primary" onclick="approve('${item.id}')">Approve</button>
                <button class="btn btn-reject" onclick="reject('${item.id}')">Reject</button>
              </div>
              <div class="status-msg" id="status-${item.id}"></div>
            </div>
          </div>`;
      }
      if (item.wet) {
        const roundOptions = Array.from({ length: 14 }, (_, i) => i + 1)
          .map(n => `<option value="${n}" ${n === item.roundNum ? 'selected' : ''}>${n}</option>`).join('');
        return `
          <div class="review-item" data-id="${item.id}" style="grid-template-columns:1fr;">
            <div>
              <div class="review-meta"><span class="pill wet">WET</span> ${duplicatePill(item)}&nbsp;
                Round <select id="round-${item.id}" onchange="updateWetRoundNote('${item.id}')">${roundOptions}</select>
                reported postponed &middot; submitted ${new Date(item.createdAt).toLocaleString()}</div>
              <p class="section-sub" id="wet-note-${item.id}" style="margin:8px 0;">${wetRoundNoteText(item.roundNum)}</p>
              <div class="review-actions">
                <button class="btn btn-primary" onclick="approve('${item.id}')">Approve</button>
                <button class="btn btn-reject" onclick="reject('${item.id}')">Reject</button>
              </div>
              <div class="status-msg" id="status-${item.id}"></div>
            </div>
          </div>`;
      }

      const teamA = item.teamA ? teamLabel(item.teamA) : 'Team A';
      const teamB = item.teamB ? teamLabel(item.teamB) : 'Team B';
      const matchupPrefix = item.mode === 'finals' ? `Finals — ${item.finalsSlot}` : `Round ${item.roundNum}, Court ${item.courtNum}`;
      const locationField = item.mode === 'finals' ? `
        <div class="field-row"><label>Finals slot</label>
          <select id="slot-${item.id}" onchange="updateFinalsMatchup('${item.id}')">
            ${FINALS_SLOTS_LIST.map(s => `<option value="${s}" ${s === item.finalsSlot ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>` : `
        <div class="field-row"><label>Round</label>
          <select id="round-${item.id}" onchange="updateWeeklyMatchup('${item.id}')">
            ${Array.from({ length: 14 }, (_, i) => i + 1).map(n => `<option value="${n}" ${n === item.roundNum ? 'selected' : ''}>${n}</option>`).join('')}
          </select>
        </div>
        <div class="field-row"><label>Court</label>
          <select id="court-${item.id}" onchange="updateWeeklyMatchup('${item.id}')">
            ${[1, 2, 3, 4].map(n => `<option value="${n}" ${n === item.courtNum ? 'selected' : ''}>Court ${n}</option>`).join('')}
          </select>
        </div>`;
      const winnerField = item.mode === 'finals' ? `
        <div class="field-row">
          <label>Winner</label>
          <select id="winner-${item.id}">
            <option value="A" ${item.extracted.winner === 'A' ? 'selected' : ''}>${teamA}</option>
            <option value="B" ${item.extracted.winner === 'B' ? 'selected' : ''}>${teamB}</option>
          </select>
        </div>` : '';
      return `
        <div class="review-item" data-id="${item.id}">
          <img data-photo-id="${item.id}" data-photo-store="pending" alt="Score sheet photo" style="cursor:zoom-in; background:var(--paper-line); min-height:120px;" onclick="openLightbox(this.src)">
          <div>
            <div class="review-meta"><span id="matchup-${item.id}">${matchupPrefix} — ${teamA} v ${teamB}</span> ${duplicatePill(item)} ${mismatchPill(item)} &middot; submitted ${new Date(item.createdAt).toLocaleString()}</div>
            <div class="field-grid">
              ${locationField}
              <div class="field-row"><label>Sets — <span class="team-label" data-item="${item.id}" data-team="A">${teamA}</span></label><input type="number" step="0.5" id="setsA-${item.id}" value="${item.extracted.setsA}"></div>
              <div class="field-row"><label>Sets — <span class="team-label" data-item="${item.id}" data-team="B">${teamB}</span></label><input type="number" step="0.5" id="setsB-${item.id}" value="${item.extracted.setsB}"></div>
              <div class="field-row"><label>Games — <span class="team-label" data-item="${item.id}" data-team="A">${teamA}</span></label><input type="number" id="gamesA-${item.id}" value="${item.extracted.gamesA}"></div>
              <div class="field-row"><label>Games — <span class="team-label" data-item="${item.id}" data-team="B">${teamB}</span></label><input type="number" id="gamesB-${item.id}" value="${item.extracted.gamesB}"></div>
            </div>
            ${winnerField}
            <div class="review-actions">
              <button class="btn btn-primary" onclick="approve('${item.id}')">Approve</button>
              <button class="btn btn-reject" onclick="reject('${item.id}')">Reject</button>
            </div>
            <div class="status-msg" id="status-${item.id}"></div>
          </div>
        </div>`;
    }).join('');
    loadPhotosInto(reviewList);
  }

  // ---- Live-updating labels when round/court/slot/stage is corrected on a pending item ----
  const FINALS_SLOTS_LIST = ['game1', 'game2', 'game3', 'semi1', 'semi2', 'final'];
  const FINALS_STAGES_LIST = ['elimination', 'semis', 'grandFinal'];

  function wetRoundNoteText(roundNum) {
    return `Approving will mark Round ${roundNum} as postponed and auto-assign the next available replay date (11 Nov / 18 Nov), or record it as having no replay if both are already used.`;
  }
  function updateWetRoundNote(id) {
    document.getElementById(`wet-note-${id}`).textContent = wetRoundNoteText(document.getElementById(`round-${id}`).value);
  }

  function wetFinalsNoteText(stage) {
    const label = FINALS_STAGE_LABELS[stage] || stage;
    return `Approving will push ${label} (and every finals stage after it) back one week to the following Wednesday.`;
  }
  function updateWetFinalsNote(id) {
    document.getElementById(`wet-note-${id}`).textContent = wetFinalsNoteText(document.getElementById(`stage-${id}`).value);
  }

  function applyMatchupUpdate(id, prefix, labelA, labelB) {
    const matchupEl = document.getElementById(`matchup-${id}`);
    if (matchupEl) matchupEl.textContent = `${prefix} — ${labelA} v ${labelB}`;
    document.querySelectorAll(`.team-label[data-item="${id}"][data-team="A"]`).forEach(el => el.textContent = labelA);
    document.querySelectorAll(`.team-label[data-item="${id}"][data-team="B"]`).forEach(el => el.textContent = labelB);
    const winnerSel = document.getElementById(`winner-${id}`);
    if (winnerSel) {
      winnerSel.options[0].textContent = labelA;
      winnerSel.options[1].textContent = labelB;
    }
  }
  function updateWeeklyMatchup(id) {
    const roundNum = Number(document.getElementById(`round-${id}`).value);
    const courtNum = Number(document.getElementById(`court-${id}`).value);
    const slot = slotForCourt(roundNum, courtNum);
    const [teamA, teamB] = ALL_ROUNDS[roundNum - 1][slot];
    applyMatchupUpdate(id, `Round ${roundNum}, Court ${courtNum}`, teamLabel(teamA), teamLabel(teamB));
  }
  function updateFinalsMatchup(id) {
    const slot = document.getElementById(`slot-${id}`).value;
    const info = computeFinalsState()[slot];
    const labelA = info && info.teamA ? teamLabel(info.teamA) : 'Team A';
    const labelB = info && info.teamB ? teamLabel(info.teamB) : 'Team B';
    applyMatchupUpdate(id, `Finals — ${slot}`, labelA, labelB);
  }

  // Each photo is its own request (get-photo.js), not inlined into the list
  // response -- combining every photo into one JSON payload hits Netlify's
  // 6MB function response cap as soon as more than a couple are pending.
  async function loadPhotoInto(imgEl) {
    const id = imgEl.dataset.photoId;
    const storeName = imgEl.dataset.photoStore;
    try {
      const res = await fetch(`/.netlify/functions/get-photo?store=${storeName}&id=${encodeURIComponent(id)}`, { headers: authHeader() });
      if (!res.ok) { imgEl.alt = 'Could not load photo'; return; }
      const blob = await res.blob();
      imgEl.src = URL.createObjectURL(blob);
    } catch {
      imgEl.alt = 'Could not load photo';
    }
  }
  function loadPhotosInto(container) {
    container.querySelectorAll('img[data-photo-id]').forEach(loadPhotoInto);
  }

  function renderArchiveList(items) {
    const isRejected = archiveStatus === 'rejected';
    const verb = isRejected ? 'rejected' : 'approved';

    if (items.length === 0) {
      archiveList.innerHTML = archiveRoundFilter.value
        ? `<p class="empty-note">No ${verb} sheet for that round/court yet.</p>`
        : `<p class="empty-note">Nothing ${verb} yet.</p>`;
      return;
    }

    archiveList.innerHTML = items.map(item => {
      const whenRaw = isRejected ? item.rejectedAt : item.approvedAt;
      const when = whenRaw ? new Date(whenRaw).toLocaleString() : '';
      const reasonNote = isRejected && item.reason ? ` &middot; Reason: ${item.reason}` : '';

      if (item.wet && item.mode === 'finals') {
        const stageLabel = FINALS_STAGE_LABELS[item.finalsStage] || item.finalsStage;
        return `
          <div class="review-item" style="grid-template-columns:1fr;">
            <div class="review-meta"><span class="pill wet">WET</span>&nbsp; ${stageLabel} marked postponed &middot; ${verb} ${when}${reasonNote}</div>
          </div>`;
      }
      if (item.wet) {
        return `
          <div class="review-item" style="grid-template-columns:1fr;">
            <div class="review-meta"><span class="pill wet">WET</span>&nbsp; Round ${item.roundNum} marked postponed &middot; ${verb} ${when}${reasonNote}</div>
          </div>`;
      }

      const teamA = item.teamA ? teamLabel(item.teamA) : 'Team A';
      const teamB = item.teamB ? teamLabel(item.teamB) : 'Team B';
      const matchup = `${teamA} v ${teamB}`;
      const label = item.mode === 'finals'
        ? `Finals — ${item.finalsSlot} — ${matchup}`
        : `Round ${item.roundNum}, Court ${item.courtNum} — ${matchup}`;
      const r = item.approved || item.extracted;
      const winnerNote = r.winner ? ` &middot; Winner: ${r.winner === 'A' ? teamA : teamB}` : '';

      return `
        <div class="review-item">
          <img data-photo-id="${item.id}" data-photo-store="${archiveStatus}" alt="Score sheet photo" style="cursor:zoom-in; background:var(--paper-line); min-height:120px;" onclick="openLightbox(this.src)">
          <div>
            <div class="review-meta">${label} &middot; ${verb} ${when}${reasonNote}</div>
            <div class="review-meta mono">${r.setsA}&ndash;${r.setsB} sets &middot; ${r.gamesA}&ndash;${r.gamesB} games${winnerNote}</div>
          </div>
        </div>`;
    }).join('');
    loadPhotosInto(archiveList);
  }

  function openLightbox(src) {
    document.getElementById('photo-lightbox-img').src = src;
    document.getElementById('photo-lightbox').classList.add('show');
  }

  // Disables both buttons on this item's card while a request is in
  // flight, so a rapid double-click can't fire two approve/reject calls
  // for the same id before the first one lands.
  function setItemButtonsDisabled(id, disabled) {
    document.querySelectorAll(`[data-id="${id}"] .review-actions button`).forEach(btn => { btn.disabled = disabled; });
  }

  async function approve(id) {
    const statusEl = document.getElementById(`status-${id}`);
    statusEl.className = 'status-msg';
    statusEl.textContent = 'Publishing…';
    setItemButtonsDisabled(id, true);

    const setsAEl = document.getElementById(`setsA-${id}`);
    const body = setsAEl ? {
      id,
      setsA: Number(setsAEl.value),
      setsB: Number(document.getElementById(`setsB-${id}`).value),
      gamesA: Number(document.getElementById(`gamesA-${id}`).value),
      gamesB: Number(document.getElementById(`gamesB-${id}`).value),
    } : { id }; // wet-round report -- nothing to correct, just approve/reject
    const winnerEl = document.getElementById(`winner-${id}`);
    if (winnerEl) body.winner = winnerEl.value;
    // Round/court/slot/stage corrections made on the review page, if any.
    const roundEl = document.getElementById(`round-${id}`);
    if (roundEl) body.roundNum = Number(roundEl.value);
    const courtEl = document.getElementById(`court-${id}`);
    if (courtEl) body.courtNum = Number(courtEl.value);
    const slotEl = document.getElementById(`slot-${id}`);
    if (slotEl) body.finalsSlot = slotEl.value;
    const stageEl = document.getElementById(`stage-${id}`);
    if (stageEl) body.finalsStage = stageEl.value;

    try {
      const res = await fetch('/.netlify/functions/approve-sheet', {
        method: 'POST',
        headers: { 'content-type': 'application/json', ...authHeader() },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = data.error || 'Failed to publish.';
        setItemButtonsDisabled(id, false);
        return;
      }
      archiveCache.approved.loaded = false; // this approval added a new entry -- refetch next time that tab opens
      loadPending();
    } catch {
      statusEl.className = 'status-msg error';
      statusEl.textContent = 'Network error -- check your connection and try again.';
      setItemButtonsDisabled(id, false);
    }
  }

  async function reject(id) {
    const reason = prompt('Reason for rejecting (optional):');
    if (reason === null) return; // cancelled -- back out, don't reject

    const statusEl = document.getElementById(`status-${id}`);
    statusEl.className = 'status-msg';
    statusEl.textContent = 'Rejecting…';
    setItemButtonsDisabled(id, true);

    try {
      const res = await fetch('/.netlify/functions/reject-sheet', {
        method: 'POST',
        headers: { 'content-type': 'application/json', ...authHeader() },
        body: JSON.stringify({ id, reason: reason.trim() || undefined }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        statusEl.className = 'status-msg error';
        statusEl.textContent = data.error || 'Failed to reject -- try again.';
        setItemButtonsDisabled(id, false);
        return;
      }
      archiveCache.rejected.loaded = false; // this rejection added a new entry -- refetch next time that tab opens
      loadPending();
    } catch {
      statusEl.className = 'status-msg error';
      statusEl.textContent = 'Network error -- check your connection and try again.';
      setItemButtonsDisabled(id, false);
    }
  }

  document.getElementById('unlock-btn').addEventListener('click', () => {
    const pw = document.getElementById('password').value;
    sessionStorage.setItem('reviewPassword', pw);
    authStatus.textContent = '';
    loadPending();
  });

  if (sessionStorage.getItem('reviewPassword')) loadPending();
</script>
</body>
</html>
